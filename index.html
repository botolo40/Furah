<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Espace public</title>
    <style>
        body { font-family: Arial; padding: 20px; }
        .item { border-bottom: 1px solid #ccc; margin: 15px 0; padding: 10px; }
        img { max-width: 200px; vertical-align: top; margin-right: 10px; }
    </style>
</head>
<body>
    <h1>Publications</h1>
    <div id="contenu">Chargement...</div>

    <script>
        // Bin ID (public)
        const BIN_ID = '69b5a5dac3097a1dd52594bd';
        const READ_URL = `https://api.jsonbin.io/v3/b/${BIN_ID}/latest`;

        async function afficherPublications() {
            try {
                const response = await fetch(READ_URL);
                const data = await response.json();
                // Le contenu est dans data.record.articles
                const elements = data.record.articles || [];
                const contenuDiv = document.getElementById('contenu');

                if (elements.length === 0) {
                    contenuDiv.innerHTML = '<p>Aucune publication pour le moment.</p>';
                    return;
                }

                let html = '';
                elements.forEach(element => {
                    html += `
                        <div class="item">
                            <img src="${element.image}" alt="Image">
                            <p><strong>${element.texte}</strong></p>
                            <small>Publié le ${element.date}</small>
                        </div>
                    `;
                });
                contenuDiv.innerHTML = html;
            } catch (error) {
                console.error(error);
                document.getElementById('contenu').innerHTML = '<p>Erreur de chargement.</p>';
            }
        }

        // Lancer au chargement de la page
        afficherPublications();
    </script>
</body>
</html>
